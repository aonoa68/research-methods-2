site_name: データ分析入門・リサーチ方法論2
site_description: 立教大学「データ分析入門・リサーチ方法論2」2024年度（一部 2025年度の補足資料） 授業資料（過去の担当授業）
site_author: 小野原 彩香
site_url: https://aonoa68.github.io/research-methods-2/
repo_url: https://github.com/aonoa68/research-methods-2
repo_name: aonoa68/research-methods-2

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - ホーム: index.md
  - 各回の資料:
      - "第1回 ガイダンス／記述統計学と推測統計学": week01.md
      - "第2回 データのハンドリングと図表作成": week02.md
      - "第3回 統計データの種類とその性質": week03.md
      - "第4回 記述統計（1）：度数分布・代表値": week04.md
      - "第5回 記述統計（2）：散布度・正規分布": week05.md
      - "第6回 相関分析": week06.md
      - "第7回 サンプリングの理論": week07.md
      - "第8回 確率論と統計的推計の基礎": week08.md
      - "第9回 平均値・比率の区間推定": week09.md
      - "第10回 統計的仮説検定の理論": week10.md
      - "第11回 平均値の差の検定": week11.md
      - "第12回 比率の差の検定（カイ二乗検定）と分散分析": week12.md
      - "第13回 単回帰分析": week13.md
      - "第14回 重回帰分析": week14.md
  - 担当授業の一覧（Teaching）: https://aonoa68.github.io/teaching/

copyright: © 小野原 彩香 — 立教大学「データ分析入門・リサーチ方法論2」（2023〜2025年度）
